<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <form id="create-listing-form" class="flex flex-col">
        <h2> Create a new listing </h2>
        <label for="listing-title"> Title </label>
        <input type="text" id="listing-title" class="border-2"> 

        <label for="listing-description"> Description </label>
        <input type="text" id="listing-description" class="border-2"> 
        
        <label for="listing-tags"> Tags
        </label>
        <input type="text" id="listing-tags" class="border-2"> 
        <label for="listing-image"> Image </label>
        <input type="text" id="listing-image" class="border-2"> 
        <label for="listing-image-alt"> Describe your image</label>
        <input type="text" id="listing-image-alt" class="border-2"> 
        <button class="btn">Add image</button>
        <label for="listing-endtime"> Select date and time the listing ends </label>
        <input type="datetime-local" class="border-2" id="listing-endtime" name="listing-endtime" value="">
        <div class="flex flex-row justify-end gap-4"> 
        <button class="btn"> Cancel</button>
        <button class="btn"> Confirm </button>
    </div>
    </form>
</body>
</html>
