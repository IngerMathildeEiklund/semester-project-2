<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1 class="text-3xl mb-8"> Listing </h1>
      <section id="one-listing">
        
      </section>
      <section id="bids-container" class="p-2" aria-labelledby="bids-heading">
        <h2 id="bids-heading" class="text-2xl mb-4"> Bids </h2> 
        <div> 
        <table class="w-full border-collapse p-4">
          <caption class="sr-only"> Bids on this listing </caption>
          <thead class="border-2-blue-600">
            <tr>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2 mb-4"> Bidder </th>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2"> Amount </th>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2"> Added </th>
            </tr>
          </thead>
          <tbody id="bids-body" class="border-2-blue-600"></tbody>
        </table>
      </div>
      <form>
        <input type="text" name="bid-amount" class="border-2 border-blue-500 w-full"> 
        <button class="mt-4 p-2 w-full items-center justify-center align-center bg-blue-600"> Place a bid </button>
      </form>
      </section>
    </main>
    <script type="module" src="/src/listing.ts"></script>
  </body>
</html>
