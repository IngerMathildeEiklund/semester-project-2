<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <dialog id="update-listing-modal"></dialog>
    <dialog id="delete-listing-modal"></dialog>
    <a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:p-2 focus:underline" href="#main"> Skip to content</a>
    <main id="main" tabindex="-1" class="container mx-auto flex flex-col p-2">
      <div id="toast-container" role="status" aria-live="polite"></div>
      <h1 class="text-3xl mb-8"> Listing </h1>
      <section id="one-listing">
        
      </section>
      <section id="bids-container" class="p-2" aria-labelledby="bids-heading">
        
        <h2 id="bids-heading" class="text-2xl mb-4"> Bids </h2> 
        <div tabindex="0" class="overflow-x-auto" role="region" aria-label="Bids table"> 
        <table class="w-full border-collapse p-4">
          <caption class="sr-only"> Bids on this listing </caption>
          <thead class="border-2-blue-600">
            <tr>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2 mb-4"> Bidder </th>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2"> Amount ($) </th>
              <th scope="col" class="text-start border-b-2 border-gray-300 pb-2"> Added </th>
            </tr>
          </thead>
          <tbody id="bids-body" class="border-2-blue-600"></tbody>
        </table>
      </div>
      <form id="add-bid-form" class="mt-4">
        <label for="add-bid-input"> Bid amount </label>
         <p id="add-bid-hint" class="text-sm"> Enter an amount in dollars, e.g 10</p>
         <p id="add-bid-error" class="text-sm text-red-800"></p>
        <div class="flex flex-row"> 
        <input id="add-bid-input" min="1" step="1" aria-describedby="add-bid-hint" type="number" name="bidAmount" class="border-2 border-blue-500 w-fit"> 
        <button id="add-bid-btn" class="btn bg-blue-600"> Place a bid 
        </button>
      </div>
      </form>
      </section>
    </main>
    <script type="module" src="/src/listing.ts"></script>
    <script type="module" src="/src/components/addBid.ts"></script>
    <script type="module" src="/src/components/updateListingModal.ts"></script>
  </body>
</html>
