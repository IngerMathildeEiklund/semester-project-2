<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container mx-auto flex flex-col">
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <h1 class="mb-4 text-3xl font-bold md:mb-9">Login</h1>
      <section id="login-section">
        <form
          id="login-form"
          class="flex flex-col justify-center gap-8 p-4 md:gap-16 md:p-9"
        >
          <div class="flex w-full flex-col gap-2 self-center md:w-96">
            <label for="login-email-input"> Email address </label>
            <input
              id="login-email-input"
              class="input"
              name="email"
              autocomplete="email"
              type="email"
              required
            />
          </div>
          <div class="flex w-full flex-col gap-2 self-center md:w-96">
            <label for="login-password-input"> Password </label>
            <input
              id="login-password-input"
              class="input"
              name="password"
              autocomplete="current-password"
              type="password"
              required
            />
          </div>
          <p class="text-center">
            Don't have an account? Register
            <a class="font-bold" href="/pages/register.html">here</a>
          </p>
          <button id="login-button" class="btn" type="submit">Login</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
