<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <dialog id="update-profile-modal"></dialog>
    <a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:p-2 focus:underline" href="#main"> Skip to content</a>
    <main id="main" tabindex="-1" class="container mx-auto flex flex-col p-2">
        <div id="toast-container" role="status" aria-live="polite"></div>
        <h1 id="profile-header" class="text-2xl"> My profile </h1>
        <section id="profile-container" class="flex flex-col">
        </section>
        
        <section aria-labelledby="own-listings-header"> 
        <h2 id="own-listings-header" class="text-2xl"> Your own listings </h2>
        <ul id="own-listings-container" class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-3"></ul>
          <nav aria-label="Own listings pages" class="flex flex-row"> 
          <button id="own-listings-prev-btn" class="btn">Previous</button>
          <button id="own-listings-next-btn" class="btn"> Next</button>
          </nav>
        </section>

        <section aria-labelledby="bid-on-listings-header"> 
        <h3 id ="bid-on-listings-header" class="text-2xl"> Listings you have bid on</h3>
        <ul id="bid-on-listings-container" class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-3"></ul>
          <nav aria-label="Bid on listings pages" class="flex flex-row"> 
          <button id="bid-on-listings-prev-btn" class="btn">Previous</button>
          <button id="bid-on-listings-next-btn" class="btn"> Next</button>
          </nav>
        </section>
        
          <section aria-labelledby="listings-won-header"> 
          <h4 id="listings-won-header" class="text-2xl"> Listings user has won </h4>
        <ul id="listings-won-container" class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-3">
          <nav aria-label="Won listings pages" class="flex flex-row"> 
          <button id="won-listings-prev-btn" class="btn">Previous</button>
          <button id="won-listings-next-btn" class="btn"> Next</button>
          </nav>
        </ul>
      </section>
    </main>
    <script type="module" src="/src/profile.ts"></script>
    <script type="module" src="/src/components/editProfile.ts"></script>
    
  </body>
</html>
