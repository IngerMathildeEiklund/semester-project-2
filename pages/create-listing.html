<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a new listing</title>
        <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:p-2 focus:underline" href="#main"> Skip to content</a>
<main id="main" tabindex="-1" class="container mx-auto flex flex-col p-2">
    <h1> Create a new listing </h1>
    <div id="successful-listing" class="hidden p-4 bg-green-300 border rounded-2xl border-b-green-600 items-center justify-center" aria-live="polite" role="status">
        <p class="text-green-900"> Listing successfully created </p>
        <a href="" class="text-green-900"> Click here to view the newly created listing </a>

    </div>
    <form id="create-listing-form" class="flex flex-col" novalidate>

        <label for="listing-title"> Title (required) </label>
        <p id="title-hint" class="text-sm">Add a descriptive title </p>
        <input class="input" id="listing-title" aria-describedby="title-error title-hint" name="title" type="text" maxlength="160">
        <p id="title-error" class="text-red-800 text-sm" aria-live="polite"></p>

        <label for="listing-description"> Description </label>
        <p id="description-hint" class="text-sm"> Add a description about what you're selling </p>
        <input class="input" id="listing-description" aria-describedby="description-hint" name="description" type="text">

        <label for="listing-tags">Tags</label>
        <p id="tags-hint" class="text-sm">Add tags separated with commas, eg "train, collectible" </p>
        <input class="input" id="listing-tags" aria-describedby="tags-hint" name="tags" type="text" maxlength="24">
        
        <div id="images-container" class="flex flex-col"></div>
        <button class="btn" id="add-image-btn" type="button">Add image</button>

        <label for="listing-endtime"> Expiration (required) </label>
        <p id="endtime-hint" class="text-sm"> Select date and time the listing ends</p>
        <input class="input" type="datetime-local" name="endsAt" id="listing-endtime" aria-describedby="endtime-error endtime-hint" value="">
        <p id="endtime-error" class="text-red-800 text-sm" aria-live="polite"></p>

        <div class="flex flex-row gap-4 items-center justify-center mt-8"> 
            <a href="./index.html">Return to homepage </a>
        <button id="create-listing-btn" class="btn"> Create listing </button>
    </div>
    </form>
</main>
<script type="module" src="/src/createListing.ts"></script>
</body>
</html>
