<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>semester-project-2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:p-2 focus:underline" href="#main"> Skip to content</a>
    <main id="main" tabindex="-1" class="container mx-auto flex flex-col p-2">
      <h1 id="listings-header">Listings</h1>
      <form class="flex flex-row justify-between" role="search"> 
      <div> 
      <label for="searchbar"> Search listings</label>
      <input id="searchbar" type="search" class="border-red-600 border-4">

      </div>

      <div>
        <label for="tag-filter">Search for a tag</label>
        <input id="tag-filter" list="tag-options" placeholder="All tags"/>
        <datalist id="tag-options"></datalist>
      </div>
      
      <div> 
      <label for="status-filter"> Status </label>
      <select id="status-filter" name="filter">
        <option value="">All</option>
        <option value="true">Active</option>
        <option value="false">Ended</option>
      </select>
    </div>
  </form>
      <ul
        id="listings" aria-labelledby="listings-header"
        class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-3"
      >
    </ul>      
      <p id="error-msg" role="status"></p>

      <div class=" flex items-center justify-center mt-4"> 
      <p id="page-info" aria-live="polite"></p>
    </div>
      <nav class="flex flex-row items-center justify-center gap-4" id="pagination" aria-label="Pagination">
        
        <button id="prev-btn" class="btn"> Previous </button>
        <button id="page-btn-1" class="page-btn btn">1</button>
        <button id="page-btn-2" class="page-btn btn">2</button>
        <button id="page-btn-3" class="page-btn btn">3</button>
        <button id="next-btn" class="btn"> Next</button>
      </nav>

    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
